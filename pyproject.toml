[project]
name = "ddg-search"
version = "0.2.0"
description = "ddg-search MCP: DuckDuckGo discovery with multi-backend routing"
requires-python = ">=3.10"
dependencies = [
  "duckduckgo-mcp-server[browser]==0.6.1",
  "httpx>=0.28.1",
  "mcp>=1.26.0"
]

[project.scripts]
ddg-search = "ddg_search.server:main"
ddg = "ddg_search.server:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pyrefly>=0.9",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ddg_search"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyrefly]
project-includes = ["src", "tests"]
